<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="SkillX Task Builder" />
  <title>SkillX Task Builder</title>
  <link rel="stylesheet" href="css/style.css?v=1.8" />
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <button class="icon-btn mobile-only" id="menuBtn" type="button" aria-label="Open navigation">☰</button>
      <a class="logo-link" href="https://skillx-elearningpills.com/" target="_blank" rel="noopener" aria-label="SkillX">
        <img src="https://skillx-elearningpills.com/wp-content/uploads/2026/11/PROJE-LOGOSU.jpg" alt="SkillX" class="logo-img" onerror="this.style.display='none'" />
      </a>
    </div>
    <div class="top-actions">
      <span class="save-status" id="saveStatus"></span>
      <button class="btn btn-light" id="newBtn" type="button" data-i18n="newTask"></button>
      <button class="btn btn-light" id="openBtn" type="button" data-i18n="openPackage"></button>
      <button class="icon-btn theme-toggle" id="themeBtn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">☾</button>
      <button class="btn btn-light" id="previewBtn" type="button" data-i18n="preview"></button>
      <button class="btn btn-light" id="exportBtn" type="button" data-i18n="saveProject">Download reusable project</button>
      <button class="btn btn-primary" id="prepareAiBtn" type="button" data-i18n="prepareAI">Download AI task</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-nav">
        <a href="#basic" class="nav-link active" data-i18n="basicTask"></a>
        <a href="#knowledge" class="nav-link" data-i18n="knowledgeSpace"></a>
        <a href="#guidance" class="nav-link" data-i18n="solutionGuidance"></a>
        <a href="#subtasks" class="nav-link" data-i18n="subtasks"></a>
        <div id="subtaskNav" class="subtask-nav"></div>
      </nav>
      <div class="sidebar-bottom">
        <button class="sidebar-contrast" id="contrastBtn" type="button" aria-label="High contrast mode" title="High contrast mode" aria-pressed="false">
          <svg class="accessibility-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <circle class="accessibility-bg" cx="16" cy="16" r="15"></circle>
            <circle class="accessibility-dot" cx="10.5" cy="11" r="2.35"></circle>
            <circle class="accessibility-dot" cx="21.5" cy="11" r="2.35"></circle>
            <circle class="accessibility-dot" cx="16" cy="21" r="2.35"></circle>
          </svg>
          <span data-i18n="contrastMode">High contrast mode</span>
        </button>
        <div class="size-line"><span data-i18n="packageSize"></span><span id="packageSizeText">0.0 MB</span></div>
        <div class="meter"><div class="meter-fill" id="packageMeter"></div></div>
      </div>
    </aside>

    <main class="content">
      <section class="section" id="basic">
        <h1 data-i18n="basicTask"></h1>

        <label class="field language-field">
          <span class="label"><span data-i18n="taskLanguage"></span> <span class="required">*</span></span>
          <select id="taskLanguage">
            <option value="en">English</option>
            <option value="tr">Türkçe</option>
            <option value="lt">Lietuvių</option>
            <option value="ro">Română</option>
            <option value="hu">Magyar</option>
            <option value="el">Ελληνικά</option>
          </select>
        </label>

        <label class="field">
          <span class="label"><span data-i18n="taskTitle"></span> <span class="required">*</span></span>
          <input id="taskTitle" type="text" maxlength="160" />
        </label>

        <label class="field">
          <span class="label"><span data-i18n="taskDescription"></span> <span class="required">*</span></span>
          <textarea id="taskDescription" rows="8"></textarea>
        </label>

        <div class="attachment-block">
          <div class="attachment-head">
            <span class="label" data-i18n="attachments"></span>
            <button class="link-btn" type="button" data-add-attachment="task"><span data-i18n="addAttachment"></span></button>
          </div>
          <div id="taskAttachmentList" class="attachment-list"></div>
        </div>
      </section>

      <section class="section" id="knowledge">
        <h1 data-i18n="knowledgeSpace"></h1>
        <label class="field unlabeled-field">
          <textarea id="knowledgeText" rows="10"></textarea>
        </label>
      </section>

      <section class="section" id="guidance">
        <h1 data-i18n="solutionGuidance"></h1>
        <label class="field">
          <span class="label" data-i18n="suggestedSolution"></span>
          <textarea id="solutionGuidance" rows="8"></textarea>
        </label>
        <label class="field">
          <span class="label" data-i18n="guidanceStuck"></span>
          <textarea id="generalHelp" rows="5"></textarea>
        </label>
      </section>

      <section class="section" id="subtasks">
        <h1 data-i18n="subtasks"></h1>
        <div id="subtasksContainer" class="subtasks"></div>
        <div class="subtask-add-row">
          <button class="btn btn-secondary" id="addSubtaskBtn" type="button"><span data-i18n="addSubtask"></span></button>
        </div>
      </section>

      <div class="bottom-actions">
        <button class="btn btn-light" id="bottomPreviewBtn" type="button" data-i18n="preview"></button>
        <button class="btn btn-light" id="bottomExportBtn" type="button" data-i18n="saveProject">Download reusable project</button>
        <button class="btn btn-primary" id="bottomPrepareAiBtn" type="button" data-i18n="prepareAI">Download AI task</button>
      </div>
    </main>
  </div>

  <input id="attachmentInput" type="file" multiple hidden />
  <input id="openPackageInput" type="file" accept=".zip,.skillx.zip,application/zip" hidden />

  <dialog id="startDialog" class="dialog start-dialog">
    <img src="https://skillx-elearningpills.com/wp-content/uploads/2026/11/PROJE-LOGOSU.jpg" alt="SkillX" class="start-logo" onerror="this.style.display='none'" />
    <div class="start-buttons">
      <button class="btn btn-primary btn-large" id="startNewBtn" type="button" data-i18n="createNew"></button>
      <button class="btn btn-secondary btn-large" id="startOpenBtn" type="button" data-i18n="openSkillxPackage"></button>
    </div>
    <button class="link-btn hidden" id="resumeBtn" type="button" data-i18n="resumeDraft"></button>
  </dialog>

  <dialog id="previewDialog" class="dialog preview-dialog">
    <div class="dialog-header">
      <h2 data-i18n="preview"></h2>
      <button class="icon-btn" type="button" data-close-dialog="previewDialog" aria-label="Close">×</button>
    </div>
    <div id="previewContent" class="preview-content"></div>
    <div class="dialog-actions">
      <button class="btn btn-light" type="button" data-close-dialog="previewDialog" data-i18n="close"></button>
      <button class="btn btn-primary" id="previewExportBtn" type="button" data-i18n="saveProject">Download reusable project</button>
    </div>
  </dialog>

  <dialog id="confirmDialog" class="dialog confirm-dialog">
    <h2 id="confirmTitle"></h2>
    <p id="confirmText"></p>
    <div class="dialog-actions">
      <button class="btn btn-light" id="confirmCancel" type="button" data-i18n="cancel"></button>
      <button class="btn btn-danger" id="confirmOk" type="button" data-i18n="continue"></button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="vendor/jszip.min.js?v=1.8"></script>
  <script src="js/app.js?v=1.8"></script>
</body>
</html>
