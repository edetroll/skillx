<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="SkillX Task Builder" />
  <title>SkillX Task Builder</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <button class="icon-btn mobile-only" id="menuBtn" type="button" aria-label="Open navigation">☰</button>
      <a class="logo-link" href="https://skillx-elearningpills.com/" target="_blank" rel="noopener">
        <span class="logo-fallback">SkillX</span><img src="https://skillx-elearningpills.com/wp-content/uploads/2026/11/PROJE-LOGOSU.jpg" alt="SkillX" class="logo-img" onerror="this.style.display='none'" />
      </a>
      <div class="brand-title">Task Builder</div>
    </div>
    <div class="top-actions">
      <span class="save-status" id="saveStatus">Saved locally</span>
      <button class="btn btn-light" id="newBtn" type="button">New</button>
      <button class="btn btn-light" id="openBtn" type="button">Open package</button>
      <button class="btn btn-light icon-only" id="themeBtn" type="button" aria-label="Change theme">◐</button>
      <button class="btn btn-light" id="previewBtn" type="button">Preview</button>
      <button class="btn btn-primary" id="exportBtn" type="button">Export package</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-nav">
        <a href="#basic" class="nav-link active">Basic task</a>
        <a href="#knowledge" class="nav-link">Knowledge space</a>
        <a href="#guidance" class="nav-link">Solution & guidance</a>
        <div class="nav-group-head">
          <a href="#subtasks" class="nav-link nav-link-plain">Subtasks</a>
          <button id="sideAddSubtask" class="mini-add" type="button" aria-label="Add subtask">＋</button>
        </div>
        <div id="subtaskNav" class="subtask-nav"></div>
      </nav>
      <div class="sidebar-bottom">
        <div class="size-line"><span>Package size</span><span id="packageSizeText">0.0 MB</span></div>
        <div class="meter"><div class="meter-fill" id="packageMeter"></div></div>
      </div>
    </aside>

    <main class="content">
      <section class="section" id="basic">
        <h1>Basic task</h1>

        <label class="field">
          <span class="label">Task title <span class="required">*</span></span>
          <input id="taskTitle" type="text" maxlength="160" />
        </label>

        <label class="field">
          <span class="label">Task description <span class="required">*</span></span>
          <textarea id="taskDescription" rows="8"></textarea>
        </label>

        <div class="attachment-block">
          <div class="attachment-head">
            <span class="label">Attachments</span>
            <button class="link-btn" type="button" data-add-attachment="task">＋ Add attachment</button>
          </div>
          <div id="taskAttachmentList" class="attachment-list"></div>
        </div>
      </section>

      <section class="section" id="knowledge">
        <h1>Knowledge space</h1>
        <label class="field unlabeled-field">
          <textarea id="knowledgeText" rows="10"></textarea>
        </label>
      </section>

      <section class="section" id="guidance">
        <h1>Solution & guidance</h1>
        <label class="field">
          <span class="label">Suggested solution / direction</span>
          <textarea id="solutionGuidance" rows="8"></textarea>
        </label>
        <label class="field">
          <span class="label">Guidance if the learner is stuck</span>
          <textarea id="generalHelp" rows="5"></textarea>
        </label>
      </section>

      <section class="section" id="subtasks">
        <div class="section-title-row">
          <h1>Subtasks</h1>
          <button class="btn btn-secondary" id="addSubtaskBtn" type="button">＋ Add subtask</button>
        </div>
        <div id="subtasksContainer" class="subtasks"></div>
      </section>

      <div class="bottom-actions">
        <button class="btn btn-light" id="bottomPreviewBtn" type="button">Preview</button>
        <button class="btn btn-primary" id="bottomExportBtn" type="button">Export package</button>
      </div>
    </main>
  </div>

  <input id="attachmentInput" type="file" multiple hidden />
  <input id="openPackageInput" type="file" accept=".zip,.skillx.zip,application/zip" hidden />

  <dialog id="startDialog" class="dialog start-dialog">
    <div class="start-logo-wrap"><span class="start-logo-fallback">SkillX</span><img src="https://skillx-elearningpills.com/wp-content/uploads/2026/11/PROJE-LOGOSU.jpg" alt="SkillX" class="start-logo" onerror="this.style.display='none'" /></div>
    <h2>Task Builder</h2>
    <div class="start-buttons">
      <button class="btn btn-primary btn-large" id="startNewBtn" type="button">Create new task</button>
      <button class="btn btn-secondary btn-large" id="startOpenBtn" type="button">Open SkillX package</button>
    </div>
    <button class="link-btn hidden" id="resumeBtn" type="button">Resume saved draft</button>
  </dialog>

  <dialog id="previewDialog" class="dialog preview-dialog">
    <div class="dialog-header">
      <h2>AI instructions preview</h2>
      <button class="icon-btn" type="button" data-close-dialog="previewDialog">×</button>
    </div>
    <pre id="previewContent" class="preview-content"></pre>
    <div class="dialog-actions">
      <button class="btn btn-light" type="button" data-close-dialog="previewDialog">Close</button>
      <button class="btn btn-primary" id="downloadMdBtn" type="button">Download .md</button>
    </div>
  </dialog>

  <dialog id="confirmDialog" class="dialog confirm-dialog">
    <h2 id="confirmTitle">Continue?</h2>
    <p id="confirmText"></p>
    <div class="dialog-actions">
      <button class="btn btn-light" id="confirmCancel" type="button">Cancel</button>
      <button class="btn btn-danger" id="confirmOk" type="button">Continue</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="vendor/jszip.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
